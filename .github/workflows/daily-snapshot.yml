name: Daily data snapshot

# 15:15 UTC is 8:15 AM Pacific Daylight Time and 7:15 AM Pacific Standard Time.
# The job records today's snapshot from committed rows. It does not fetch news
# and it does not edit rows. It commits only when the snapshot file changes.
on:
  schedule:
    - cron: "15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write today's snapshot
        run: node --experimental-strip-types scripts/write-snapshot.ts
      - name: Commit when the snapshot changes
        run: |
          git add data/history
          if git diff --cached --quiet; then
            echo "Snapshot matches the committed data. No commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record the daily data snapshot"
          git push
